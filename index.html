<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crow Kim">
<title>Crow Kim의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Black+Han+Sans&display=swap">

<style>
/* 레이아웃: 태블릿 가로 한 화면.
   위 줄 = [모래시계 퀘스트 타이머] [오늘의 퀘스트 + 배지/레벨] [날씨 / 아빠 귀가]
   아래 줄 = 월~일 학원 스케줄. 좁은 화면에서는 세로로 쌓이고 스크롤.
   콘셉트: 블록 게임 월드. 하늘색 격자 바닥, 두툼한 검정 테두리 + 아래로 떨어지는 블록 그림자,
   원색(빨강·노랑·초록·파랑·보라) 블록, 금빛 모래, 둥글둥글한 게임 글씨. */
:root {
  --bg: #0e0f13;            /* 까마귀 깃털 검정 (밤) */
  --grid: rgba(255, 255, 255, .045);
  --ink: #15161b;           /* 카드 안 글자, 테두리 */
  --ink-soft: #3d3f4a;
  --muted: #6f7280;
  --card: #f7f4ec;          /* 크림색 카드 */
  --panel: #ece8de;
  --line: #d9d4c7;
  --ember: #ff9b1f;         /* 부리 주황 (포인트) */
  --ember-deep: #d97a08;
  --moon: #f3efe4;
  --forest: #2b2d36;
  --forest-deep: #1c1d24;
  --wood: #4a4c58;
  --wood-deep: #2c2d35;
  --feather: #5b5fd6;       /* 깃털 광택 (남보라) */
  --sky-text: #f7f4ec;
  --red: #ff4d4d;
  --red-deep: #c93333;
  --yellow: #ffd23f;
  --yellow-deep: #d9a800;
  --green: #3ad17f;
  --green-deep: #22955a;
  --blue: #3d8bff;
  --blue-deep: #2a63c4;
  --purple: #9a6bff;
  --purple-deep: #6d44c9;
  --orange: #ff9f2e;
  --sand: #ffb02e;
  --shadow-ink: 0 6px 0 #000, 0 0 0 2px rgba(255, 155, 31, .22);
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Black Han Sans", "Apple SD Gothic Neo", system-ui, sans-serif;
  --font: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background-color: var(--bg);
  transition: background-color 1.2s;
  background-image:
    radial-gradient(ellipse at 50% 120%, rgba(91, 95, 214, .22), transparent 55%),
    linear-gradient(var(--grid) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size: 100% 100%, 48px 48px, 48px 48px;
  background-position: 0 0, -1px -1px, -1px -1px;
  background-attachment: fixed;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
/* 별 + 달 (블록) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at calc(63% + 16px) calc(7% - 12px), var(--bg) 20px, transparent 21px),
    radial-gradient(circle at 63% 7%, var(--moon) 24px, rgba(255, 242, 196, .25) 25px, transparent 34px),
    linear-gradient(#fff, #fff) 8% 9% / 6px 6px no-repeat,
    linear-gradient(#fff, #fff) 21% 4% / 4px 4px no-repeat,
    linear-gradient(#fff, #fff) 33% 12% / 5px 5px no-repeat,
    linear-gradient(#fff, #fff) 47% 6% / 4px 4px no-repeat,
    linear-gradient(#fff, #fff) 61% 10% / 6px 6px no-repeat,
    linear-gradient(#fff, #fff) 74% 3% / 4px 4px no-repeat,
    linear-gradient(#fff, #fff) 82% 14% / 5px 5px no-repeat,
    linear-gradient(#fff, #fff) 96% 20% / 4px 4px no-repeat,
    linear-gradient(#fff, #fff) 15% 22% / 4px 4px no-repeat;
  opacity: .9;
}
/* 바닥: 떨어진 깃털 */
body::after {
  content: "";
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 120px;
  z-index: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 120'><g fill='none' stroke='%23ffffff' stroke-opacity='.18' stroke-width='2' stroke-linecap='round'><path d='M40 100c20-40 50-55 80-60-10 30-40 55-80 60z'/><path d='M60 96l50-50'/><path d='M250 110c10-45 40-65 75-72-5 35-35 62-75 72z'/><path d='M262 104l55-58'/></g></svg>");
  background-repeat: repeat-x;
  background-size: 400px 120px;
  background-position: bottom left;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.app {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  padding-top: max(10px, env(safe-area-inset-top, 0px));
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, 2.2vw, env(safe-area-inset-left, 0px));
  padding-right: max(16px, 2.2vw, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 12px;
}

/* ---------- 헤더 ---------- */
header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
}
.brand-wrap { display: flex; align-items: flex-end; gap: 22px; min-width: 0; }
.eyebrow {
  font-family: var(--font-display);
  font-size: clamp(12px, 1.2vw, 15px);
  letter-spacing: .12em;
  color: var(--ink);
  background: var(--ember);
  border: 3px solid #000;
  border-radius: 8px;
  padding: 2px 10px;
  display: inline-block;
  box-shadow: 0 3px 0 var(--ink);
}
.brand {
  margin: 3px 0 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(22px, 2.6vw, 32px);
  line-height: 1.1;
  color: #fff;
  -webkit-text-stroke: 1.5px #000;
  text-shadow: 3px 3px 0 #000, 0 0 18px rgba(91, 95, 214, .55);
  text-wrap: balance;
}
.subtitle {
  margin-top: 3px;
  font-size: clamp(13px, 1.4vw, 17px);
  font-weight: 800;
  color: var(--moon);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 54vw;
}
/* 까마귀 + 사진 */
.hero-left { display: flex; align-items: flex-end; gap: 10px; flex-shrink: 0; margin-right: 8px; }
.crow { width: 62px; height: 62px; animation: idle 2.6s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.7)); }
.crow svg { width: 100%; height: 100%; overflow: visible; }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.crow .wing { transform-origin: 48px 70px; }
.crow.happy { animation: hop .5s cubic-bezier(.3, 1.6, .5, 1) infinite alternate; }
.crow.happy .wing { animation: flap .25s ease-in-out infinite alternate; }
@keyframes hop { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-12px) rotate(3deg); } }
@keyframes flap { from { transform: rotate(0); } to { transform: rotate(-28deg); } }
.photo {
  position: relative; width: 52px; height: 52px; border-radius: 50%;
  border: 3px solid #000; background: #2a2c34; box-shadow: 0 4px 0 #000, 0 0 0 3px var(--ember);
  display: grid; place-items: center; overflow: hidden; cursor: pointer; flex-shrink: 0; margin-bottom: 6px;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo-empty { color: #cfd0d8; font-size: 17px; line-height: 1; text-align: center; }
.photo-empty small { display: block; font-size: 10px; font-weight: 900; margin-top: 2px; }
.photo-del {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; padding: 0; border-radius: 50%;
  border: 2px solid #000; background: #fff; color: #c00; font-size: 11px; line-height: 1; box-shadow: none;
}
.locked .photo-del { display: none !important; }
/* 까마귀 댄스 */
#danceOverlay { position: fixed; inset: 0; z-index: 30; background: #000; overflow: hidden; display: grid; grid-template-rows: 1fr auto; place-items: center; animation: fadein .5s; }
#danceOverlay .spot { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(40px); opacity: .35; mix-blend-mode: screen; animation: spot 4s ease-in-out infinite; }
#danceOverlay .s1 { background: #5b5fd6; left: -20vmax; top: -10vmax; }
#danceOverlay .s2 { background: #ff9b1f; right: -20vmax; top: 0; animation-delay: -1.3s; }
#danceOverlay .s3 { background: #ff5aa5; left: 20vmax; bottom: -30vmax; animation-delay: -2.6s; }
@keyframes spot { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(8vmax, 6vmax) scale(1.15); } }
#danceOverlay .dance-sparks { position: absolute; inset: 0; pointer-events: none; }
#danceOverlay .dance-sparks span { position: absolute; bottom: -40px; animation: rise linear infinite; opacity: 0; }
@keyframes rise { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
#danceOverlay .dance-stage { position: relative; display: grid; place-items: center; align-self: end; }
#danceOverlay .dance-crow { width: min(52vh, 70vw); height: min(52vh, 70vw); animation: dance .47s ease-in-out infinite alternate; transform-origin: 50% 90%; }
#danceOverlay .dance-crow svg { width: 100%; height: 100%; overflow: visible; }
@keyframes dance { 0% { transform: translateX(-9%) rotate(-7deg) scaleY(1); } 50% { transform: translateX(0) rotate(0) scaleY(.93) translateY(3%); } 100% { transform: translateX(9%) rotate(7deg) scaleY(1); } }
#danceOverlay .head { transform-origin: 84px 50px; animation: headbob .235s ease-in-out infinite alternate; }
@keyframes headbob { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-3px); } }
#danceOverlay .beak-low { transform-origin: 101px 50px; animation: sing .47s ease-in-out infinite alternate; }
@keyframes sing { from { transform: rotate(0); } to { transform: rotate(14deg); } }
#danceOverlay .wing-l { transform-origin: 48px 70px; animation: flapdance .235s ease-in-out infinite alternate; }
@keyframes flapdance { from { transform: rotate(0); } to { transform: rotate(-34deg); } }
#danceOverlay .tail { transform-origin: 36px 84px; animation: wag .47s ease-in-out infinite alternate; }
@keyframes wag { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
#danceOverlay .leg-a { transform-origin: 54px 100px; animation: kick .47s ease-in-out infinite alternate; }
#danceOverlay .leg-b { transform-origin: 66px 100px; animation: kick .47s ease-in-out infinite alternate-reverse; }
@keyframes kick { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
#danceOverlay .dance-floor { width: min(60vh, 80vw); height: 14px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(255,155,31,.6), rgba(255,155,31,0) 70%); margin-top: -6px; animation: floor .47s ease-in-out infinite alternate; }
@keyframes floor { from { transform: scaleX(.9); opacity: .6; } to { transform: scaleX(1.1); opacity: 1; } }
#danceOverlay .dance-text { text-align: center; padding: 10px 16px 28px; z-index: 1; }
#danceOverlay .dance-title { font-family: var(--font-display); font-size: clamp(34px, 6.5vw, 76px); color: #fff; text-shadow: 0 0 24px rgba(255,155,31,.6); animation: cawpop 1.9s ease-in-out infinite; }
#danceOverlay .dance-sub { font-size: clamp(15px, 2vw, 24px); color: #e8e4da; font-weight: 800; margin-top: 4px; }
#danceOverlay button { margin-top: 14px; background: var(--ember); border-color: #000; color: #000; }
#danceOverlay.long .dance-title { color: #ffd27a; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes cawpop { 0%, 60%, 100% { transform: scale(1); opacity: .85; } 15%, 35% { transform: scale(1.12); opacity: 1; } }

.clock-wrap { text-align: right; flex-shrink: 0; }
.clock {
  font-family: var(--font-num);
  font-weight: 900;
  font-size: clamp(32px, 4.2vw, 50px);
  line-height: 1;
  color: #fff;
  -webkit-text-stroke: 1.5px #000;
  text-shadow: 3px 3px 0 #000, 0 0 18px rgba(91, 95, 214, .55);
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
}
.date {
  margin-top: 6px;
  font-size: clamp(12px, 1.3vw, 15px);
  color: var(--moon);
  font-weight: 800;
}
.tools { display: flex; justify-content: flex-end; gap: 6px; margin-top: 6px; }
.tools button {
  font-size: clamp(11px, 1.1vw, 13px);
  padding: 6px 10px;
  border-radius: 8px;
  box-shadow: 0 3px 0 var(--ink);
  background: var(--card);
}
.tools button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }

/* ---------- 카드 ---------- */
.card {
  background: var(--card);
  border: 3px solid #000;
  border-radius: 18px;
  box-shadow: var(--shadow-ink), 0 0 28px rgba(91, 95, 214, .14);
  padding: 14px 16px 16px;
  min-width: 0;
  min-height: 0;
  position: relative;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
}
.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(18px, 2vw, 25px);
  line-height: 1.2;
}
.tiny { font-size: clamp(10px, 1.05vw, 12px); color: var(--muted); font-weight: 800; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.card-head h2 { white-space: nowrap; flex-shrink: 0; }
.chip {
  font-family: var(--font-display);
  font-size: clamp(12px, 1.2vw, 15px);
  padding: 4px 11px;
  border: 3px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--ink);
  white-space: nowrap;
  background: var(--panel);
}

main.top {
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr) minmax(0, .92fr);
  gap: 14px;
}
.side { min-height: 0; min-width: 0; display: grid; grid-template-rows: auto 1fr; gap: 14px; }

/* ---------- 버튼 ---------- */
button {
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 9px 15px;
  background: var(--card);
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(14px, 1.45vw, 18px);
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 5px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
button:active { transform: translateY(5px); box-shadow: 0 0 0 var(--ink); }
button.primary {
  background: var(--ember);
  padding: 11px 24px;
  font-size: clamp(17px, 1.8vw, 22px);
}
button.warn { background: var(--yellow); }
button.danger { background: var(--red); color: #fff; }
button:focus-visible, input:focus-visible, [contenteditable]:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

/* ---------- 타이머 ---------- */
.timer-card { display: flex; flex-direction: column; overflow: hidden; transition: background .5s; }
.timer-card[data-stage="calm"] { background: #eef0ff; }
.timer-card[data-stage="hurry"] { background: #ffe9c4; }
.timer-card[data-stage="urgent"] { background: #ffcfb8; animation: shake 1.1s ease-in-out infinite; }
.timer-card[data-stage="done"] { background: #d9d8dd; }
.timer-card[data-stage="success"] { background: #dff3dc; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-2px); }
  40% { transform: translateX(2px); }
  60% { transform: translateX(-1px); }
  80% { transform: translateX(1px); }
}
.timer-card[data-stage="calm"] .chip { background: var(--feather); color: #fff; }
.timer-card[data-stage="hurry"] .chip { background: var(--yellow); }
.timer-card[data-stage="urgent"] .chip { background: var(--ember-deep); color: #fff; }
.timer-card[data-stage="success"] .chip { background: var(--green); }
.timer-top { display: flex; align-items: center; gap: 10px; }
.hourglass-wrap { flex: 0 0 auto; width: clamp(60px, 6.6vw, 76px); height: clamp(90px, 9.9vw, 114px); display: flex; justify-content: center; }
.timer-status { display: flex; align-items: center; gap: 8px; margin-top: 6px; min-width: 0; }
.timer-status .chip { font-size: clamp(11px, 1.1vw, 13px); padding: 3px 9px; box-shadow: 0 2px 0 var(--ink); }
.timer-card .card-head { margin-bottom: 6px; }
.hourglass-wrap svg { width: 100%; height: 100%; overflow: visible; }
.timer-mid { flex: 1 1 auto; min-width: 0; }
.mission-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; padding-right: 2px; }
.mission-list .task { margin-bottom: 3px; box-shadow: 0 2px 0 var(--ink); }
.mission-list .task label { min-height: 26px; padding: 1px 8px; font-size: clamp(14px, 1.45vw, 18px); gap: 9px; }
.mission-list .task input { width: 24px; height: 24px; border-width: 2.5px; }
.mission-list .task input:checked::after { line-height: 19px; font-size: 16px; }
.mission-list .task .del { width: 24px; height: 24px; font-size: 12px; }
.add-area.mini { margin-top: 4px; }
.add-area.mini input { padding: 5px 10px; font-size: 13px; }
.add-area.mini button { padding: 4px 10px; font-size: 13px; }
.locked .add-area.mini { display: none; }
.locked #importBtn { display: none; }
#importArea { margin: 0 0 8px; }
.stream {
  stroke: var(--sand);
  stroke-width: 4;
  stroke-linecap: butt;
  stroke-dasharray: 4 6;
  animation: flow .5s linear infinite;
}
@keyframes flow { to { stroke-dashoffset: -10; } }
.countdown {
  text-align: center;
  font-family: var(--font-num);
  font-weight: 900;
  font-size: clamp(34px, 4.4vw, 52px);
  line-height: 1.05;
  letter-spacing: 1px;
  font-variant-numeric: tabular-nums;
  margin-top: 6px;
  color: #fff;
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 4px 4px 0 var(--ink), 0 0 14px rgba(255, 138, 42, .6);
}
.countdown small {
  display: block;
  font-family: var(--font);
  font-size: clamp(10px, 1.05vw, 12px);
  letter-spacing: 0;
  color: var(--ink-soft);
  font-weight: 800;
  margin-top: 6px;
  -webkit-text-stroke: 0;
  text-shadow: none;
}
/* 블록 진행바: 1분 = 블록 1개 */
.film {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  margin: 6px 0 0;
  padding: 5px;
  background: var(--ink);
  border-radius: 10px;
}
.frame {
  height: 16px;
  border-radius: 4px;
  background: #3a3340;
  overflow: hidden;
}
.frame i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--wood-deep), var(--wood) 40%, var(--ember) 100%);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.25);
  transition: width .3s linear;
}
.timer-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.timer-controls button.primary { padding: 9px 18px; font-size: clamp(15px, 1.6vw, 19px); }
.duration {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--panel);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 2px;
}
.duration button {
  width: 30px; height: 30px;
  padding: 0;
  border-radius: 50%;
  border-width: 2px;
  font-size: 18px;
  line-height: 1;
  box-shadow: 0 2px 0 var(--ink);
}
.duration button:active { transform: translateY(2px); box-shadow: none; }
.duration span { min-width: 44px; text-align: center; font-family: var(--font-display); font-size: 15px; }

/* ---------- 퀘스트 + 배지 ---------- */
.tasks-card { display: flex; flex-direction: column; overflow: hidden; padding-top: 12px; padding-bottom: 12px; }
.tasks-card .card-head { margin-bottom: 8px; }
.progress { background: var(--yellow); }
.progress.complete { background: var(--green); }
.task-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-right: 4px; }
.task {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  background: var(--panel);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  padding: 0 8px 0 0;
  box-shadow: 0 3px 0 var(--ink);
}
.task.done { background: #e4fbee; }
.task label {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 10px;
  font-size: clamp(16px, 1.75vw, 21px);
  font-weight: 800;
  cursor: pointer;
  min-height: 35px;
}
.task label span { min-width: 0; overflow-wrap: anywhere; }
.task input {
  appearance: none;
  -webkit-appearance: none;
  margin: 0;
  width: 28px; height: 28px;
  flex-shrink: 0;
  border: 3px solid var(--ink);
  border-radius: 7px;
  background: #fff;
  cursor: pointer;
}
.task input:checked { background: var(--green); }
.task input:checked::after {
  content: "✓";
  color: var(--ink);
  display: block;
  text-align: center;
  line-height: 22px;
  font-size: 20px;
  font-weight: 900;
}
.task.done label span { text-decoration: line-through; opacity: .45; }
.task .del {
  flex-shrink: 0;
  width: 28px; height: 28px;
  padding: 0;
  border-radius: 8px;
  border-width: 2px;
  background: #fff;
  color: var(--red-deep);
  font-size: 14px;
  box-shadow: 0 2px 0 var(--ink);
}
.task .del:active { transform: translateY(2px); box-shadow: none; }
.add-area { display: flex; gap: 6px; margin-top: 6px; }
.add-area input {
  min-width: 0;
  flex: 1;
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 15px;
  font-family: inherit;
  font-weight: 700;
  color: var(--ink);
  background: #fff;
  outline: none;
}
.add-area button { padding: 6px 14px; box-shadow: 0 3px 0 var(--ink); }
.add-area button:active { transform: translateY(3px); box-shadow: none; }
.sticker-row { margin-top: 8px; padding-top: 8px; border-top: 3px dashed var(--line); }
.sticker-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-family: var(--font-display);
  font-size: clamp(13px, 1.3vw, 16px);
}
.level {
  white-space: nowrap;
  flex-shrink: 0;
  background: #000;
  color: #fff;
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  padding: 2px 10px;
  box-shadow: 0 2px 0 var(--ink);
}
.sticker-board {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 4px;
  margin-top: 6px;
}
.slot {
  aspect-ratio: 1;
  width: 100%;
  max-width: 32px;
  margin: 0 auto;
  border-radius: 7px;
  border: 2.5px dashed var(--line);
  background: var(--panel);
  display: grid;
  place-items: center;
  font-size: clamp(14px, 1.7vw, 22px);
}
.slot.filled {
  border-style: solid;
  border-color: var(--ink);
  background: #fff;
  box-shadow: 0 3px 0 var(--ink);
}
.slot.new { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { from { transform: scale(.2) rotate(-20deg); } to { transform: none; } }
.sticker-note { font-size: clamp(10px, 1.05vw, 12px); color: var(--muted); font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; margin: 0 8px; }

/* ---------- 날씨 / 아빠 ---------- */
.weather-list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.weather-item {
  background: var(--panel);
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  padding: 9px 11px;
  min-width: 0;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  column-gap: 8px;
  align-items: center;
}
.weather-item .w-icon { grid-row: 1 / 3; font-size: clamp(24px, 2.6vw, 34px); line-height: 1; }
.weather-item .w-day { font-size: clamp(11px, 1.15vw, 14px); font-weight: 900; color: var(--muted); }
.weather-item .w-temp { font-family: var(--font-display); font-size: clamp(14px, 1.5vw, 20px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.weather-item .w-temp small { display: block; font-family: var(--font); font-size: .62em; font-weight: 800; color: var(--muted); white-space: nowrap; }
.weather-item .w-desc { grid-column: 1 / 3; font-size: clamp(11px, 1.1vw, 13px); color: var(--ink-soft); font-weight: 800; margin-top: 4px; overflow-wrap: anywhere; }

.mood-card { display: flex; flex-direction: column; background: #fff4df; --stud: var(--yellow); }
.mood-row { display: flex; gap: 6px; justify-content: space-between; }
.mood-row button {
  flex: 1; padding: 6px 0; font-size: clamp(22px, 2.6vw, 32px); line-height: 1.1;
  background: #fff; border-width: 2.5px; box-shadow: 0 3px 0 var(--ink); filter: grayscale(.6); opacity: .7;
}
.mood-row button.on { filter: none; opacity: 1; background: var(--yellow); transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.mood-row button:active { transform: translateY(3px); box-shadow: none; }
.mood-note {
  flex: 1 1 auto; min-height: 2.8em; margin-top: 10px;
  font-size: clamp(14px, 1.5vw, 18px); font-weight: 800; line-height: 1.45;
  outline: none; overflow-wrap: anywhere; overflow-y: auto;
  background: rgba(255,255,255,.7); border: 2.5px dashed var(--line-strong, #cfc6e4); border-radius: 10px; padding: 8px 10px;
}
.mood-week { display: flex; gap: 4px; margin-top: 8px; }
.mood-week span {
  flex: 1; text-align: center; font-size: clamp(13px, 1.4vw, 17px); line-height: 1;
  background: rgba(255,255,255,.7); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 0; opacity: .9;
}
.mood-week span.empty { opacity: .3; }
.mood-week span.today { background: var(--yellow); }
.mood-week small { display: block; font-size: 9px; font-weight: 900; color: var(--muted); margin-top: 2px; }
html.theme-day .mood-card { background: #fff6dc; }
[contenteditable="true"], [contenteditable="plaintext-only"] {
  border-radius: 8px;
  box-shadow: inset 0 0 0 2px transparent;
  transition: box-shadow .2s;
}
.unlocked [contenteditable="true"], .unlocked [contenteditable="plaintext-only"] {
  box-shadow: inset 0 0 0 2px var(--blue);
  padding: 2px 6px;
  background: rgba(255,255,255,.6);
}
[contenteditable][data-placeholder]:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  opacity: .75;
  font-weight: 800;
  -webkit-text-stroke: 0;
  text-shadow: none;
}

/* ---------- 주간 스케줄 ---------- */
.week-card { background: #efeee9; max-height: 32vh; display: flex; flex-direction: column; }
.week-card .card-head { flex-shrink: 0; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; flex: 1 1 auto; min-height: 0; }
.day {
  background: #fff;
  border: 2.5px solid var(--ink);
  border-radius: 12px;
  padding: 7px 9px 9px;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  box-shadow: 0 3px 0 var(--ink);
}
.day.today { background: #ffd98a; box-shadow: 0 5px 0 var(--ink); transform: translateY(-2px); }
.day.weekend .day-name { color: var(--red-deep); }
.day-name {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-display);
  font-size: clamp(14px, 1.4vw, 17px);
  margin-bottom: 4px;
}
.badge {
  font-family: var(--font);
  font-size: 10px;
  font-weight: 900;
  background: var(--red);
  color: #fff;
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 1px 6px;
}
.day-body {
  font-size: clamp(11px, 1.15vw, 13px);
  font-weight: 800;
  line-height: 1.35;
  min-height: 3em;
  flex: 1 1 auto;
  overflow: hidden;
  -webkit-overflow-scrolling: touch;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  outline: none;
}

/* ---------- 토스트 ---------- */
.toast { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 20; }
.toast .bubble {
  background: #ffd98a;
  border: 4px solid var(--ink);
  box-shadow: 0 10px 0 var(--ink);
  border-radius: 20px;
  padding: 20px 36px;
  font-family: var(--font-display);
  font-size: clamp(28px, 4.6vw, 56px);
  text-align: center;
  animation: pop .5s cubic-bezier(.3, 1.6, .5, 1);
}
.toast .bubble small {
  display: block;
  font-family: var(--font);
  font-size: .4em;
  color: var(--ink-soft);
  margin-top: 6px;
  font-weight: 800;
}

/* 월드 맵 */
.world-strip { display: inline-flex; align-items: center; gap: 3px; }
.world-strip .w {
  width: 24px; height: 24px;
  display: grid; place-items: center;
  font-size: 14px;
  border: 2px solid var(--ink);
  border-radius: 7px;
  background: #fff;
  opacity: .9;
}
.world-strip .w.locked { opacity: .35; filter: grayscale(1); }
.world-strip .w.current { background: var(--ember); box-shadow: 0 2px 0 var(--ink); transform: translateY(-1px); }
.world-strip .arrow { font-size: 10px; color: var(--muted); }
.world-name { display: none; }

/* 낮(학교) 모드: 오늘 남은 일정 */
.agenda { display: flex; flex-direction: column; gap: 6px; }
.agenda-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 2.5px solid var(--ink); border-radius: 12px;
  padding: 8px 12px; box-shadow: 0 3px 0 var(--ink);
  font-size: clamp(15px, 1.6vw, 20px); font-weight: 800;
}
.agenda-item.past { opacity: .45; }
.agenda-item.next { background: var(--yellow); }
.agenda-item .t { font-family: var(--font-num); font-size: 1.15em; min-width: 3.2em; letter-spacing: .5px; }
.agenda-empty { color: var(--muted); font-weight: 800; padding: 12px 4px; }
.brush {
  margin-left: auto; font-family: var(--font-num); font-size: 15px;
  background: var(--sky); border: 2px solid var(--ink); border-radius: 8px; padding: 1px 8px; white-space: nowrap;
}
/* D-day 줄 + 주간 완료 점 */
.upcoming { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.upcoming .pill {
  font-size: clamp(11px, 1.1vw, 13px); font-weight: 800; white-space: nowrap;
  background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 3px 10px;
  overflow: hidden; text-overflow: ellipsis; max-width: 260px;
}
.upcoming .pill.hot { background: var(--yellow); }
.weekdots { display: inline-flex; gap: 4px; align-items: center; margin-left: 8px; }
.weekdots i {
  width: 14px; height: 14px; border-radius: 4px; border: 2px solid var(--ink); background: #fff; display: inline-block;
}
.weekdots i.on { background: var(--ember); }
.weekdots i.today { box-shadow: 0 0 0 2px var(--yellow); }
.weekdots i.future { opacity: .35; }

/* 출발 시각 칸 */
.depart {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--font-display);
  font-size: clamp(12px, 1.2vw, 15px);
  background: var(--panel);
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  padding: 3px 10px;
  box-shadow: 0 2px 0 var(--ink);
  white-space: nowrap;
}
.depart [contenteditable] { min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
.countdown.pre { font-size: clamp(30px, 4vw, 48px); }
.mode-chip { padding: 4px 10px; border-width: 2.5px; font-size: clamp(11px, 1.1vw, 13px); box-shadow: 0 3px 0 var(--ink); }
.mode-chip:active { transform: translateY(3px); box-shadow: none; }
.tasks-card.evening { background: #e6e6f3; }
.tasks-card.evening .task { background: #fff; }
.carry {
  font-family: var(--font);
  font-size: 11px; font-weight: 900;
  background: var(--purple); color: #fff;
  border: 2px solid var(--ink); border-radius: 6px;
  padding: 1px 6px; margin-left: 6px; white-space: nowrap;
}

/* ---------- 낮 테마 (하늘 + 구름 + 도시) ---------- */
html.theme-day {
  --bg: #2a2c34;
  --grid: rgba(255, 255, 255, .05);
  --moon: #f3efe4;
  --card: #ffffff;
  --panel: #f0ede6;
  --line: #ddd8cd;
}
html.theme-day body {
  background-image:
    radial-gradient(ellipse at 50% -20%, rgba(255, 255, 255, .10), transparent 60%),
    linear-gradient(#2a2c34 0%, #343742 100%),
    linear-gradient(var(--grid) 2px, transparent 2px),
    linear-gradient(90deg, var(--grid) 2px, transparent 2px);
  background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
}
/* 낮: 흐린 해 + 회색 구름 */
html.theme-day body::before {
  background:
    radial-gradient(circle at 63% 7%, #f3efe4 22px, rgba(243, 239, 228, .25) 24px, transparent 40px),
    linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)) 6% 9% / 150px 28px no-repeat,
    linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)) 8.5% 5.2% / 90px 28px no-repeat,
    linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 84% 14% / 170px 28px no-repeat,
    linear-gradient(rgba(255,255,255,.12), rgba(255,255,255,.12)) 86% 10.3% / 100px 28px no-repeat;
  opacity: 1;
}
html.theme-day .subtitle, html.theme-day .date { color: #e8e4da; }
html.theme-day .card { box-shadow: var(--shadow-ink); }
html.theme-day .timer-card[data-stage="calm"] { background: #eef0ff; }
html.theme-day .timer-card[data-stage="hurry"] { background: #fff2cf; }
html.theme-day .timer-card[data-stage="urgent"] { background: #ffd9d9; }
html.theme-day .week-card { background: #eefbf0; }
html.theme-day .tasks-card.evening { background: #e9ebff; }

/* ---------- 블록 무늬 ---------- */
.card {
  border-radius: 12px;
  background-image:
    linear-gradient(rgba(30, 36, 51, .035) 1.5px, transparent 1.5px),
    linear-gradient(90deg, rgba(30, 36, 51, .035) 1.5px, transparent 1.5px);
  background-size: 28px 28px;
}
/* 카드 위쪽 블록 돌기 줄 */
.card::before {
  content: "";
  position: absolute;
  top: -11px; left: 14px; right: 14px;
  height: 10px;
  background: repeating-linear-gradient(90deg, var(--ink) 0 2.5px, var(--stud, #ffd23f) 2.5px 16px, var(--ink) 16px 18.5px, transparent 18.5px 28px);
  border-radius: 3px 3px 0 0;
  pointer-events: none;
}
.timer-card { --stud: var(--ember); }
.tasks-card { --stud: var(--feather); }
.weather-card { --stud: #9aa0ff; }
.mood-card { --stud: var(--yellow); }
.week-card { --stud: #c9c4b8; }
.task, .weather-item, .day, .agenda-item, .slot, .add-area input, .duration, .chip, .stage, .level, .depart, .mode-chip, .eyebrow, button { border-radius: 8px; }
.slot { border-radius: 6px; }
.duration, .depart, .chip, .level, .upcoming .pill { border-radius: 10px; }
.task { box-shadow: 0 3px 0 var(--ink), inset 0 -3px 0 rgba(0,0,0,.06); }
.film { border-radius: 6px; }
.frame { border-radius: 2px; }
.toast .bubble { border-radius: 14px; }

/* 낮 카드: 일정 요약 + 숙제 */
.day-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.day-summary .pill {
  font-size: clamp(11px, 1.15vw, 13px); font-weight: 800; white-space: nowrap;
  background: var(--panel); border: 2px solid var(--ink); border-radius: 8px; padding: 3px 9px;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.day-summary .pill.next { background: var(--yellow); }
.day-summary .pill.soft { background: transparent; border-style: dashed; color: var(--muted); }
.hw-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--font-display); font-size: clamp(14px, 1.45vw, 18px);
  margin: 2px 0 6px;
}
.hw-stars { display: inline-flex; gap: 3px; }
.hw-stars i { font-style: normal; font-size: 14px; opacity: .25; }
.hw-stars i.on { opacity: 1; }
.week-toggle { padding: 2px 9px; line-height: 1.3; border-width: 2.5px; font-size: clamp(11px, 1.1vw, 13px); box-shadow: 0 3px 0 var(--ink); margin-left: 8px; }
.week-toggle:active { transform: translateY(3px); box-shadow: none; }
.week-card.hw-view .day { background: #fff8e6; }
.week-card.hw-view .day.today { background: #ffd98a; }

/* ---------- 잠금 ---------- */
.locked .del, .locked .add-area, .locked .duration { display: none; }

/* ---------- 좁은 화면 ---------- */
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  main.top { grid-template-columns: 1fr; }
  .side { grid-template-columns: 1fr 1fr; grid-template-rows: auto; }
  .hourglass-wrap { min-height: 220px; }
  .task-list { max-height: 320px; }
  .subtitle { max-width: 100%; white-space: normal; }
  .week { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
}
@media (max-height: 700px) and (min-width: 901px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .hourglass-wrap { min-height: 200px; }
  .task-list { max-height: none; }
  .week-card { max-height: none; }
}
@media (max-width: 560px) {
  header { flex-direction: column; align-items: flex-start; }
  .clock-wrap { text-align: left; }
  .tools { justify-content: flex-start; }
  .side { grid-template-columns: 1fr; }
  .sticker-board { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>

<body>
<div class="app" id="app">
  <header>
    <div class="brand-wrap">
      <div class="hero-left">
        <div class="crow" id="crow" aria-hidden="true">

            <circle cx="93.6" cy="39.8" r="1.4" fill="#fff"/>

              <path d="M44 66 C56 50 82 54 94 66 C82 66 70 72 62 82 C54 92 44 84 44 66 Z" fill="#1e2027"/>

            </g>

            <path d="M54 100 L50 112 M66 100 L66 112" stroke="#ff9b1f" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M50 112 L42 116 M50 112 L50 118 M50 112 L58 116 M66 112 L58 116 M66 112 L66 118 M66 112 L74 116" stroke="#ff9b1f" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </div>
        <label class="photo" id="photoFrame" title="사진 넣기 (이 기기에만 저장)">
          <img id="photoImg" alt="" hidden>

          <input type="file" id="photoInput" accept="image/*" hidden>

        </label>
      </div>
      <div style="min-width:0">
        <div class="eyebrow" id="eyebrow">🪹 나뭇가지 둥지 · 반짝이 0 / 99</div>
        <h1 class="brand">Crow Kim의 하루</h1>

      </div>

    <div class="clock-wrap">
      <div class="clock" id="clock">00:00</div>

        <button id="wakeButton" type="button">☀️ 화면 유지 준비 중</button>
        <button id="soundButton" type="button" aria-label="소리">🔔</button>
        <button id="lockButton" type="button">🔓 편집 중</button>
      </div>
    </div>
  </header>

  <main class="top">

<script>
const $ = id => document.getElementById(id);

// ---------- 저장 공간 ----------
function readStore(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStore(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function readJSON(key, fallback) {
  try { const raw = readStore(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}

// ---------- 날짜 ----------
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
function dateKey(d) {
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}
function todayKey() { return dateKey(new Date()); }
function tomorrowKey() { const d = new Date(); d.setDate(d.getDate() + 1); return dateKey(d); }
function todayIndex() { return (new Date().getDay() + 6) % 7; } // 월=0 … 일=6
function timeLabel(d) { return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }); }
function shortDate(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }

// ---------- 잠금 ----------
const LOCK_KEY = 'scene_lock_v1';
let locked = readStore(LOCK_KEY) === '1';
function applyLock() {
  const app = $('app');
  app.classList.toggle('locked', locked);
  app.classList.toggle('unlocked', !locked);
  document.querySelectorAll('[data-editable]').forEach(el => {
    el.setAttribute('contenteditable', locked ? 'false' : 'plaintext-only');
  });
  $('lockButton').textContent = locked ? '🔒 잠금' : '🔓 편집 중';
  renderWeek();
  renderTasks();
  renderMissions();
}
$('lockButton').addEventListener('click', () => {
  locked = !locked;
  writeStore(LOCK_KEY, locked ? '1' : '0');
  applyLock();
});

// ---------- 소리 ----------
const SOUND_KEY = 'scene_sound_v1';
let soundOn = readStore(SOUND_KEY) !== '0';
let audioCtx = null;
function renderSound() { $('soundButton').textContent = soundOn ? '🔔' : '🔕'; }
$('soundButton').addEventListener('click', () => {
  soundOn = !soundOn;
  writeStore(SOUND_KEY, soundOn ? '1' : '0');
  renderSound();
  if (soundOn) playNotes([[880, .12]]);
});
function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function playNotes(seq) {
  if (!soundOn) return;
  try {
    ensureAudio();
    if (!audioCtx) return;
    let t = audioCtx.currentTime + 0.02;
    seq.forEach(([freq, dur]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
      t += dur;
    });
  } catch (e) {}
}

// ---------- 토스트 ----------
let toastTimer = null;
function showToast(main, sub, ms = 2800) {
  $('toastText').innerHTML = '';
  $('toastText').append(document.createTextNode(main));
  if (sub) { const s = document.createElement('small'); s.textContent = sub; $('toastText').append(s); }
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, ms);
}

// ---------- 주간 스케줄 ----------
const WEEK_KEY = 'scene_week_v1';
const DEFAULT_WEEK = ['', '', '', '', '', '', ''];
let week = readJSON(WEEK_KEY, null);
if (!Array.isArray(week) || week.length !== 7 || week.every(t => !t || !t.trim())) week = DEFAULT_WEEK.slice();
const WEEK_PLACEHOLDER = ['예: 피아노 3시', '예: 태권도 4시', '예: 미술 3시 30분', '예: 영어 4시', '예: 수영 5시', '예: 할머니 집', '예: 쉬는 날 🎮'];

// 다가오는 일: 이번 주 남은 요일의 첫 줄 + "12/3 생일"처럼 날짜가 적힌 줄의 D-day
function renderUpcoming() {
  const box = $('upcoming');
  box.innerHTML = '';
  const ti = todayIndex();
  const pills = [];
  const now = new Date();
  // 날짜가 적힌 특별한 날 (아무 칸에나 "12/3 생일" 형태로)
  const dated = [];
  week.forEach(cell => (cell || '').split('\n').forEach(line => {
    const m = line.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*(.*)/);
    if (!m) return;
    let d = new Date(now.getFullYear(), +m[1] - 1, +m[2]);
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (d < today0) d = new Date(now.getFullYear() + 1, +m[1] - 1, +m[2]);
    const days = Math.round((d - today0) / 86400000);
    dated.push({ days, label: (m[3] || '').trim() || '특별한 날', date: `${m[1]}/${m[2]}` });
  }));
  dated.sort((a, b) => a.days - b.days).slice(0, 2).forEach(e => pills.push({ hot: e.days <= 1, text: `🎉 ${e.label} ${e.days === 0 ? '오늘!' : 'D-' + e.days}` }));
  // 다음 학원 (내일부터 이번 주 남은 요일 중 첫 항목)
  for (let k = 1; k <= 6 && pills.length < 3; k++) {
    const i = (ti + k) % 7;
    const first = (week[i] || '').split('\n').map(l => l.trim()).filter(Boolean).find(l => !/\d{1,2}\s*\//.test(l));
    if (!first) continue;
    pills.push({ hot: false, text: `${k === 1 ? '내일' : DAYS[i] + '요일 (' + k + '일 뒤)'} · ${first}` });
    break;
  }
  if (!pills.length) { const p = document.createElement('span'); p.className = 'pill'; p.textContent = '📌 "12/3 생일"처럼 적으면 D-day가 떠요'; box.append(p); return; }
  pills.forEach(x => { const p = document.createElement('span'); p.className = 'pill' + (x.hot ? ' hot' : ''); p.textContent = x.text; box.append(p); });
}
function renderWeekDots() {
  const box = $('weekdots');
  box.innerHTML = '';
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - todayIndex());
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    const dot = document.createElement('i');
    if (stickers.some(s => s.date === key)) dot.classList.add('on');
    if (i === todayIndex()) dot.classList.add('today');
    if (i > todayIndex()) dot.classList.add('future');
    dot.title = `${DAYS[i]}요일`;
    box.append(dot);
  }
}

// 시간표 코드: 학원표 7칸 + 숙제 틀 7칸을 한 줄 코드로 (기기 간 옮기기용)
function encodeSchedule() {
  const json = JSON.stringify({ w: week, h: hwTpl });
  return 'CK1.' + btoa(unescape(encodeURIComponent(json)));
}
function decodeSchedule(code) {
  try {
    const m = String(code).trim().match(/^CK1\.(.+)$/);
    if (!m) return null;
    const o = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if (!Array.isArray(o.w) || o.w.length !== 7) return null;
    return o;
  } catch (e) { return null; }
}
$('importBtn').addEventListener('click', () => { if (locked) return; $('importArea').hidden = !$('importArea').hidden; });
$('importApply').addEventListener('click', () => {
  const o = decodeSchedule($('importCode').value);
  if (!o) { showToast('코드를 읽지 못했어요', 'CK1. 으로 시작하는 코드를 붙여 넣어 주세요', 2600); return; }
  week = o.w.map(x => String(x || ''));
  writeStore(WEEK_KEY, JSON.stringify(week));
  if (Array.isArray(o.h) && o.h.length === 7) { hwTpl = o.h.map(x => String(x || '')); writeStore(HW_TPL_KEY, JSON.stringify(hwTpl)); syncHomeworkTemplate(); }
  $('importCode').value = ''; $('importArea').hidden = true;
  renderWeek(); renderTasks(); updateGreeting();
  showToast('시간표 불러왔어요 📥', '학원표와 숙제 틀이 채워졌어요', 2600);
});
$('importExport').addEventListener('click', async () => {
  const code = encodeSchedule();
  $('importCode').value = code;
  try { await navigator.clipboard.writeText(code); showToast('코드 복사됨 📋', '다른 기기의 불러오기 칸에 붙여 넣으세요', 2600); } catch (e) { $('importCode').select(); }
});
let weekView = 'schedule';
$('weekToggle').addEventListener('click', () => {
  weekView = weekView === 'schedule' ? 'homework' : 'schedule';
  renderWeek();
});
const HW_PLACEHOLDER = '예: 구몬 2장';
// 요일 칸 글자가 칸 안에 다 들어오도록 글자 크기 자동 조절 (최소 10px)
function fitWeekCells() {
  document.querySelectorAll('.day-body').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize);
    let guard = 0;
    while (el.scrollHeight > el.clientHeight + 1 && size > 10 && guard < 12) { size -= .5; el.style.fontSize = size + 'px'; guard++; }
  });
}
function renderWeek() {
  renderUpcoming();
  renderWeekDots();
  const wrap = $('week');
  wrap.innerHTML = '';
  const ti = todayIndex();
  const hwView = weekView === 'homework';
  document.querySelector('.week-card').classList.toggle('hw-view', hwView);
  document.querySelector('.week-card h2').textContent = hwView ? '📚 요일별 숙제 틀' : '🗓️ 이번 주 학원';
  $('weekToggle').textContent = hwView ? '🗺️ 학원 보기' : '📚 숙제 틀';
  $('weekHint').textContent = locked ? '🔒 잠금' : (hwView ? '매주 반복되는 숙제 · 한 줄에 하나씩' : '칸을 눌러 적어 주세요');
  const source = hwView ? hwTpl : week;
  source.forEach((text, i) => {
    const day = document.createElement('div');
    day.className = 'day' + (i === ti ? ' today' : '') + (i >= 5 ? ' weekend' : '');

    const name = document.createElement('div');
    name.className = 'day-name';
    name.textContent = DAYS[i];
    if (i === ti) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = '오늘'; name.append(b); }

    const body = document.createElement('div');
    body.className = 'day-body';
    body.dataset.editable = '1';
    body.dataset.i = i;
    body.dataset.placeholder = hwView ? HW_PLACEHOLDER : WEEK_PLACEHOLDER[i];
    body.textContent = text;
    body.setAttribute('contenteditable', locked ? 'false' : 'plaintext-only');
    body.addEventListener('input', () => {
      if (body.textContent.trim() === '') body.innerHTML = '';
      const val = body.innerText.replace(/\n{2,}/g, '\n').trim();
      requestAnimationFrame(fitWeekCells);
      if (hwView) {
        hwTpl[i] = val;
        writeStore(HW_TPL_KEY, JSON.stringify(hwTpl));
        if (i === ti) { syncHomeworkTemplate(); if (currentMode() === 'day') renderTasks(); }
      } else {
        week[i] = val;
        writeStore(WEEK_KEY, JSON.stringify(week));
        if (i === ti) updateGreeting();
        renderUpcoming();
      }
    });
    body.addEventListener('paste', e => {
      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, txt);
    });

    day.append(name, body);
    wrap.append(day);
  });
  requestAnimationFrame(fitWeekCells);
}

// ---------- 까마귀 댄스 (반짝이 5개마다) ----------
// 검은 화면에서 큰 까마귀가 음악에 맞춰 춤춥니다. 음악은 기기 안에서 합성(8비트 느낌).
let danceTimer = null, danceMusic = null;
function playDanceMusic(duration) {
  if (!soundOn) return;
  try {
    ensureAudio(); if (!audioCtx) return;
    const bpm = 128, beat = 60 / bpm;
    const melody = [523, 659, 784, 659, 880, 784, 659, 523, 587, 698, 880, 698, 784, 659, 587, 523]; // C E G E A G E C D F A F G E D C
    const bass = [131, 131, 175, 175, 196, 196, 131, 131];
    const start = audioCtx.currentTime + .05;
    const total = Math.ceil(duration / 1000 / (beat * 16));
    for (let bar = 0; bar < total; bar++) {
      melody.forEach((f, i) => {
        const t = start + bar * beat * 8 + i * beat / 2;
        if (t > start + duration / 1000) return;
        const o = audioCtx.createOscillator(); o.type = 'square'; o.frequency.value = f;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.08, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + beat / 2 * .9);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + beat / 2);
      });
      bass.forEach((f, i) => {
        const t = start + bar * beat * 8 + i * beat;
        if (t > start + duration / 1000) return;
        const o = audioCtx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.16, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + beat * .8);
        o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + beat);
        // 킥 드럼
        const k = audioCtx.createOscillator(); k.type = 'sine'; k.frequency.setValueAtTime(150, t); k.frequency.exponentialRampToValueAtTime(45, t + .12);
        const kg = audioCtx.createGain(); kg.gain.setValueAtTime(0.0001, t); kg.gain.exponentialRampToValueAtTime(.35, t + .005); kg.gain.exponentialRampToValueAtTime(0.0001, t + .15);
        k.connect(kg).connect(audioCtx.destination); k.start(t); k.stop(t + .16);
        // 하이햇 (박자 사이)
        const h = audioCtx.createOscillator(); h.type = 'square'; h.frequency.value = 6000 + Math.random() * 2000;
        const hg = audioCtx.createGain(); const th = t + beat / 2; hg.gain.setValueAtTime(0.0001, th); hg.gain.exponentialRampToValueAtTime(.025, th + .003); hg.gain.exponentialRampToValueAtTime(0.0001, th + .04);
        h.connect(hg).connect(audioCtx.destination); h.start(th); h.stop(th + .05);
      });
    }
  } catch (e) {}
}
function stopDance() {
  clearTimeout(danceTimer);
  $('danceOverlay').hidden = true;
  $('danceSparks').innerHTML = '';
}
function fireworks(duration = 8000, title) {
  // 이름은 유지(다른 코드에서 호출) — 실제로는 까마귀 댄스
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  for (let i = 0; i < 26; i++) {

const LAT = 37.5145, LON = 127.1059;
const WEATHER_CACHE_KEY = 'familyDashboardWeatherV1';
const WEATHER_REFRESH_MS = 30 * 60 * 1000;
const WEATHER_FALLBACK = {
  source: '기상청 단기예보', issued: '11.21 20:00 발표',
  days: [
    { date: '2026-11-21', code: 0, min: -3, max: 2, pop: 0 },
    { date: '2026-11-22', code: 0, min: -3, max: 6, pop: 20 }
  ]
};
let lastWeatherFetch = 0;

function weatherInfo(code) {
  if (code === 0) return ['☀️', '맑음'];
  if ([1, 2].includes(code)) return ['🌤️', '구름 조금'];
  if (code === 3) return ['☁️', '흐림'];
  if ([45, 48].includes(code)) return ['🌫️', '안개'];
  if ([51, 53, 55, 56, 57].includes(code)) return ['🌦️', '이슬비'];
  if ([61, 63, 65, 66, 67, 80, 81, 82].includes(code)) return ['🌧️', '비'];
  if ([71, 73, 75, 77, 85, 86].includes(code)) return ['❄️', '눈'];
  if ([95, 96, 99].includes(code)) return ['⛈️', '천둥번개'];
  return ['🌈', '날씨'];
}
function dayLabel(dateStr) {
  if (dateStr === todayKey()) return '오늘';
  if (dateStr === tomorrowKey()) return '내일';
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth() + 1}/${d.getDate()} (${['일', '월', '화', '수', '목', '금', '토'][d.getDay()]})`;
}
function renderWeather(days, footer) {
  $('weather').innerHTML = days.slice(0, 2).map(day => {
    const [icon, desc] = weatherInfo(day.code);
    const hint = day.pop >= 60 ? ' · 우산 챙겨요 ☂️' : day.max <= 2 ? ' · 따뜻하게 입어요 🧣' : '';
    return `
      <div class="weather-item">
        <div class="w-icon">${icon}</div>
        <div class="w-day">${dayLabel(day.date)}</div>
        <div class="w-temp">${Math.round(day.min)}° ~ ${Math.round(day.max)}°<small>☔ ${day.pop ?? 0}%</small></div>
        <div class="w-desc">${desc}${hint}</div>
      </div>`;
  }).join('');
  $('weatherUpdated').textContent = footer;
}
function readWeatherCache() {
  const c = readJSON(WEATHER_CACHE_KEY, null);
  return c && Array.isArray(c.days) && c.days.length ? c : null;
}
function showOfflineWeather() {
  const cached = readWeatherCache();
  if (cached) {
    const when = new Date(cached.fetchedAt);
    const sameDay = dateKey(when) === todayKey();
    renderWeather(cached.days, `📶 ${sameDay ? '' : shortDate(when) + ' '}${timeLabel(when)} 예보`);
    return;
  }
  const stillCurrent = WEATHER_FALLBACK.days.some(d => d.date >= todayKey());
  renderWeather(WEATHER_FALLBACK.days, `📋 ${WEATHER_FALLBACK.issued}${stillCurrent ? '' : ' · 연결 대기'}`);
}
async function loadWeather() {
  lastWeatherFetch = Date.now();
  const url = 'https://api.open-meteo.com/v1/forecast?' + new URLSearchParams({
    latitude: LAT, longitude: LON,
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
    timezone: 'Asia/Seoul', forecast_days: '2'
  });
  const controller = new AbortController();
  const t = setTimeout(() => controller.abort(), 8000);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
    if (!res.ok) throw new Error('weather');
    const data = await res.json();
    const d = data.daily;
    const days = d.time.map((date, i) => ({
      date, code: d.weather_code[i], min: d.temperature_2m_min[i], max: d.temperature_2m_max[i], pop: d.precipitation_probability_max[i]
    }));
    const now = new Date();
    renderWeather(days, `🌱 ${timeLabel(now)} 업데이트`);
    writeStore(WEATHER_CACHE_KEY, JSON.stringify({ fetchedAt: now.getTime(), days }));
  } catch (e) {
    showOfflineWeather();
  } finally {
    clearTimeout(t);
  }
}
function refreshWeatherIfStale() { if (Date.now() - lastWeatherFetch > WEATHER_REFRESH_MS) loadWeather(); }

function buildHomeworkForToday() {
  const today = todayKey();
  if (hw.date === today) { syncHomeworkTemplate(); return; }
  const carried = hw.date === yesterdayKey()
    ? hw.items.filter(t => !t.done).map(t => ({ text: t.text, done: false, src: 'carry' }))
    : [];

function syncHomeworkTemplate() {
  const want = tplLines(todayIndex());
  const keep = hw.items.filter(t => t.src !== 'tpl');
  const prev = new Map(hw.items.filter(t => t.src === 'tpl').map(t => [t.text, t.done]));
  hw.items = [...keep.filter(t => t.src === 'carry'), ...want.map(text => ({ text, done: prev.get(text) || false, src: 'tpl' })), ...keep.filter(t => t.src === 'today')];
  saveHw();

// 오늘 일정 줄에서 시각 뽑기: "14시 30분 피아노", "17:50 영어", "20시 독서"
function parseLineTime(line) {
  const m = line.match(/(\d{1,2})\s*(?:시|:)\s*(\d{1,2})?\s*분?/);
  if (!m) return null;
  const h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  if (h > 23 || mi > 59) return null;
  return h * 60 + mi;
}
function renderAgenda() {
  const list = $('taskList');
  list.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'agenda';
  const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes();
  const lines = (week[todayIndex()] || '').split('\n').map(l => l.trim()).filter(Boolean);
  let nextMarked = false;
  if (!lines.length) {
    const e = document.createElement('div'); e.className = 'agenda-empty'; e.textContent = '오늘은 학원 없는 날 🎈'; wrap.append(e);
  }
  lines.forEach(line => {
    const t = parseLineTime(line);
    const item = document.createElement('div');
    item.className = 'agenda-item';
    const past = t !== null && t < nowMin;
    if (past) item.classList.add('past');
    else if (!nextMarked && t !== null) { item.classList.add('next'); nextMarked = true; }
    const tEl = document.createElement('span'); tEl.className = 't';
    tEl.textContent = t === null ? '—' : `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    const txt = document.createElement('span');
    txt.textContent = t === null ? line : line.replace(/^\s*\d{1,2}\s*(?:시|:)\s*(?:\d{1,2}\s*)?분?\s*/, '') || line;
    item.append(tEl, txt);
    if (item.classList.contains('next')) { const n = document.createElement('span'); n.className = 'carry'; n.textContent = '다음'; item.append(n); }
    if (past) { const n = document.createElement('span'); n.className = 'carry'; n.style.background = 'var(--green)'; n.style.color = 'var(--ink)'; n.textContent = '완료'; item.append(n); }
    wrap.append(item);
  });
  // 다음 일정까지 남은 시간
  const nextT = lines.map(parseLineTime).filter(t => t !== null && t >= nowMin).sort((x, y) => x - y)[0];
  if (nextT !== undefined) {
    const gap = nextT - nowMin;
    const e = document.createElement('div'); e.className = 'agenda-empty';
    e.textContent = gap === 0 ? '⏰ 지금 출발할 시간!' : `⏰ 다음 일정까지 ${gap >= 60 ? Math.floor(gap / 60) + '시간 ' : ''}${gap % 60 ? (gap % 60) + '분' : ''}`;
    wrap.append(e);
  } else if (lines.length) {
    const e = document.createElement('div'); e.className = 'agenda-empty'; e.textContent = '오늘 일정 모두 끝! 🎉'; wrap.append(e);
  }
  list.append(wrap);
  const remaining = lines.filter(l => { const t = parseLineTime(l); return t === null || t >= nowMin; }).length;
  const prog = $('progress');
  prog.textContent = lines.length ? `남은 일정 ${remaining}` : '휴식';
  prog.classList.toggle('complete', remaining === 0);
}

}
function isSchoolDay() { const i = todayIndex(); return i <= 4; } // 월~금
let autoStartedFor = readStore('scene_autostart_v1') || '';
(function initDepart() {
  const el = $('departTime');
  const t = parseDepart(departStr);
  el.textContent = t ? `${String(t.h).padStart(2, '0')}:${String(t.mi).padStart(2, '0')}` : departStr;
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
  el.addEventListener('blur', () => {
    const t = parseDepart(el.textContent);
    if (t) {
      departStr = `${String(t.h).padStart(2, '0')}:${String(t.mi).padStart(2, '0')}`;
      writeStore(DEPART_KEY, departStr);
      autoStartedFor = '';
    }
    el.textContent = departStr;
    renderTimer();
  });
})();

// ---------- 모래시계 타이머 ----------
const TIMER_KEY = 'scene_timer_v1';
const MIN_MIN = 3, MAX_MIN = 30;
let timer = readJSON(TIMER_KEY, null);
if (!timer || !timer.duration) timer = { status: 'idle', duration: 600, endsAt: 0, remaining: 600, date: todayKey() };
if (timer.date !== todayKey() && timer.status !== 'idle') { timer.status = 'idle'; timer.remaining = timer.duration; }
if (timer.status === 'running' && timer.endsAt <= Date.now()) timer.status = 'done';
function saveTimer() { timer.date = todayKey(); writeStore(TIMER_KEY, JSON.stringify(timer)); }

function remainingSec() {
  if (timer.status === 'running') return Math.max(0, (timer.endsAt - Date.now()) / 1000);
  if (timer.status === 'paused' || timer.status === 'success') return timer.remaining;
  if (timer.status === 'done') return 0;
  return timer.duration;
}
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
}

function startTimer() {
  ensureAudio();
  if (timer.status === 'paused') timer.endsAt = Date.now() + timer.remaining * 1000;
  else timer.endsAt = Date.now() + timer.duration * 1000;
  timer.status = 'running';
  saveTimer();
  playNotes([[659, .08], [784, .08], [1046, .14]]);
  renderTimer();
}
function pauseTimer() {
  if (timer.status !== 'running') return;
  timer.remaining = remainingSec();
  timer.status = 'paused';
  saveTimer();
  renderTimer();
}
function resetTimer() {
  timer.status = 'idle';
  timer.remaining = timer.duration;
  saveTimer();
  renderTimer();
}
function finishTimer() {
  timer.status = 'done';
  saveTimer();
  playNotes([[880, .2], [660, .2], [880, .2], [440, .5]]);
  showToast('시간 끝! ⏰', '남은 미션을 얼른 마무리해요', 3600);
}
function setDuration(delta) {
  if (timer.status === 'running' || timer.status === 'paused') return;
  const mins = Math.min(MAX_MIN, Math.max(MIN_MIN, Math.round(timer.duration / 60) + delta));
  timer.duration = mins * 60;
  timer.remaining = timer.duration;
  timer.status = 'idle';
  saveTimer();
  renderTimer();
}
$('startBtn').addEventListener('click', startTimer);
$('pauseBtn').addEventListener('click', pauseTimer);
$('resetBtn').addEventListener('click', resetTimer);
$('durMinus').addEventListener('click', () => setDuration(-1));
$('durPlus').addEventListener('click', () => setDuration(1));

const sandTop = $('sandTop'), sandBottom = $('sandBottom'), mound = $('mound'), stream = $('stream');
function renderHourglass(frac, running) {
  frac = Math.min(1, Math.max(0, frac));
  const topY = 30 + (1 - frac) * 120;
  sandTop.setAttribute('y', topY.toFixed(1));
  sandTop.setAttribute('height', Math.max(0, 150 - topY).toFixed(1));
  const bottomY = 270 - (1 - frac) * 120;
  sandBottom.setAttribute('y', bottomY.toFixed(1));
  sandBottom.setAttribute('height', Math.max(0, 270 - bottomY).toFixed(1));
  mound.setAttribute('cy', bottomY.toFixed(1));
  mound.setAttribute('rx', ((1 - frac) > .02 ? 8 + 34 * (1 - frac) : 0).toFixed(1));
  if (running && frac > 0) {
    stream.setAttribute('visibility', 'visible');
    stream.setAttribute('y2', (bottomY - 2).toFixed(1));
  } else {
    stream.setAttribute('visibility', 'hidden');
  }
}

let filmFrames = 0;
function renderFilm(rem, dur) {
  const n = Math.min(MAX_MIN, Math.max(1, Math.round(dur / 60)));
  const film = $('film');
  if (filmFrames !== n) {
    film.innerHTML = '';
    for (let i = 0; i < n; i++) { const f = document.createElement('div'); f.className = 'frame'; f.append(document.createElement('i')); film.append(f); }
    filmFrames = n;
  }
  const perFrame = dur / n;
  film.querySelectorAll('.frame i').forEach((bar, i) => {
    const fill = Math.min(1, Math.max(0, rem / perFrame - i));
    bar.style.width = (fill * 100).toFixed(1) + '%';
  });
}

function fmtLong(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : fmt(sec);
}

function renderTimer() {
  const dur = timer.duration;
  const now = Date.now();
  const dep = departToday();
  const schoolDay = isSchoolDay();

  // 출발 10분 전: 그날 한 번 자동 시작 (끝 시각 = 출발 시각)
  if (dep && schoolDay && timer.status === 'idle' && autoStartedFor !== todayKey() && !allDone()) {
    const untilDep = (dep.getTime() - now) / 1000;
    if (untilDep > 0 && untilDep <= dur) {
      ensureAudio();
      timer.status = 'running';
      timer.endsAt = dep.getTime();
      autoStartedFor = todayKey();
      writeStore('scene_autostart_v1', autoStartedFor);
      saveTimer();
      playNotes([[659, .08], [784, .08], [1046, .14]]);
      showToast('출발 10분 전! 🪶', '아침 미션 시작!', 3000);
    }
  }

  let rem = remainingSec();
  if (timer.status === 'running' && rem <= 0) { finishTimer(); rem = 0; }
  const frac = dur ? rem / dur : 0;
  const st = timer.status;

  // 출발 전 대기 화면: 출발까지 남은 시간을 크게
  const cd = $('countdown');
  const preDepart = st === 'idle' && dep && schoolDay && dep.getTime() - now > dur * 1000;
  // 미션을 다 끝낸 뒤: 출발까지 카운트다운 → 출발 시각이 지나면 "다녀와요"
  const doneWait = allDone() && dep && schoolDay && (st === 'success' || st === 'idle' || st === 'done') && !preDepart;
  const afterDepart = doneWait && dep.getTime() - now <= 0;
  cd.classList.toggle('pre', !!preDepart || !!doneWait);
  if (preDepart) {
    cd.textContent = fmtLong((dep.getTime() - now) / 1000);
  } else if (afterDepart) {
    cd.textContent = '다녀와요! 🪶';
  } else if (doneWait) {
    cd.textContent = fmtLong((dep.getTime() - now) / 1000);
  } else {
    cd.textContent = fmt(rem);
  }
  const depLabel = dep ? `${String(dep.getHours()).padStart(2, '0')}:${String(dep.getMinutes()).padStart(2, '0')}` : '';
  const autoAt = dep ? new Date(dep.getTime() - dur * 1000) : null;
  $('departNote').textContent =
    !dep ? '출발 시각을 HH:MM으로 적어 주세요' :
    !schoolDay ? '주말엔 자동 시작 없음 · 출발!로 직접 시작' :
    preDepart ? `${String(autoAt.getHours()).padStart(2, '0')}:${String(autoAt.getMinutes()).padStart(2, '0')}에 자동 시작` :
    dep.getTime() - now <= 0 && st === 'idle' ? `오늘 출발 ${depLabel} 지남` :
    st === 'running' ? `${depLabel} 출발` : '';
  $('timerTitle').textContent = `⏳ 등교 전 ${Math.round(dur / 60)}분`;
  $('durLabel').textContent = `${Math.round(dur / 60)}분`;
  renderHourglass(frac, st === 'running');
  renderFilm(rem, dur);

  let stage = 'idle', label = '준비 완료!', note = '출발!을 누르면 모래가 떨어져요';
  if (preDepart) { label = allDone() ? '미션 끝! 여유 있어요 🪶' : '출발 대기 🚪'; note = '출발까지 남은 시간이에요'; if (allDone()) stage = 'success'; }
  if (afterDepart) { stage = 'success'; label = '오늘 아침 미션 완료 🪶'; note = '학교 잘 다녀와요!'; }
  else if (doneWait) { stage = 'success'; label = '미션 끝! 여유 있어요'; note = '출발까지 남은 시간이에요'; }
  if (doneWait) { /* 위에서 정함 */ }
  else if (st === 'running') {
    if (frac > .5) { stage = 'calm'; label = '순조로워요 🪶'; note = '칸 하나에 1분이에요'; }
    else if (frac > .2) { stage = 'hurry'; label = '조금 서둘러요 ⚡'; note = '남은 칸을 확인해요'; }
    else { stage = 'urgent'; label = '마지막 스퍼트! 💨'; note = '거의 다 왔어요'; }
  } else if (st === 'paused') { stage = 'paused'; label = '잠시 멈춤 ⏸'; note = '계속을 누르면 이어져요'; }
  else if (st === 'done') { stage = 'done'; label = '시간 끝 ⏰'; note = '다음엔 더 빨리 해볼까요?'; }
  else if (st === 'success') { stage = 'success'; label = '날아올랐다! 🪶'; note = `${fmt(timer.remaining)} 남기고 다 했어요`; }
  $('timerCard').dataset.stage = stage;
  $('stage').textContent = label;
  $('countdownNote').textContent = note;

  const start = $('startBtn');
  start.textContent = st === 'paused' ? '▶ 계속' : (st === 'done' || st === 'success') ? '🪶 한 번 더' : '🪶 출발!';
  start.hidden = st === 'running' || afterDepart;
  $('pauseBtn').hidden = st !== 'running';
  $('resetBtn').hidden = st === 'idle';
  $('duration').hidden = !(st === 'idle' || st === 'done' || st === 'success');
}

// ---------- 화면 꺼짐 방지 ----------
let wakeLock = null;
let wakeEnabled = true;
async function requestWakeLock() {
  if (!wakeEnabled) return;
  if (!('wakeLock' in navigator)) { $('wakeButton').textContent = '💡 자동 잠금을 "안 함"으로'; return; }
  if (document.visibilityState !== 'visible') return;
  try {
    if (wakeLock && !wakeLock.released) return;
    wakeLock = await navigator.wakeLock.request('screen');
    $('wakeButton').textContent = '✨ 화면 켜짐 유지 중';
    wakeLock.addEventListener('release', () => { $('wakeButton').textContent = '💤 화면 유지 해제됨 · 탭'; wakeLock = null; });
  } catch (e) {
    $('wakeButton').textContent = '☀️ 탭해서 화면 유지';
  }
}
$('wakeButton').addEventListener('click', async () => {
  if (wakeLock && !wakeLock.released) {
    wakeEnabled = false;
    await wakeLock.release();
    wakeLock = null;
    $('wakeButton').textContent = '💤 화면 유지 꺼짐 · 탭';
  } else {
    wakeEnabled = true;
    await requestWakeLock();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { requestWakeLock(); updateClock(); renderTimer(); refreshWeatherIfStale(); }
});

// ---------- 오프라인 저장 (서버가 꺼져 있어도 열리게) ----------
(function setupOffline() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const firstTime = !navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').then(reg => {
    const sw = reg.installing || reg.waiting;
    if (firstTime && sw) {
      sw.addEventListener('statechange', () => {
        if (sw.state === 'activated') showToast('오프라인 저장 완료 📦', '이제 서버 없이도 홈 화면에서 바로 열려요', 3600);
      });
    }
  }).catch(() => {});
})();

// ---------- 시작 ----------
renderWeek();
renderMood();
applyLock();          // renderTasks, renderMissions 포함
renderStickers();
renderSound();
renderTimer();
updateClock();
setInterval(updateClock, 1000);
setInterval(renderTimer, 250);
loadWeather();
setInterval(loadWeather, WEATHER_REFRESH_MS);
window.addEventListener('online', loadWeather);
window.addEventListener('resize', () => requestAnimationFrame(fitWeekCells));
requestWakeLock();
</script>
